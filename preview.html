          skillLevel: selectedSkillLevel,
          assessmentScore: score,

            const matchesCompany = opp.company.toLowerCase().includes(q);
            const matchesDomain = opp.domain.toLowerCase().includes(q);
            const matchesType = opp.type.toLowerCase().includes(q);
            const matchesSkills = opp.requiredSkills.some((s) => s.toLowerCase().includes(q));

          if (activeRadarTab === 'nextRoadmap') return opp.domain === profile.targetDomain;
          return true;

      const [postGradCgpa, setPostGradCgpa] = useState('');
      const [targetDomain, setTargetDomain] = useState(DOMAINS.DATA_ANALYTICS);
      const [targetGoal, setTargetGoal] = useState(GOAL_TYPES.INTERNSHIP);
      const [formError, setFormError] = useState('');

      const handleResumeChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
            setFormError('Please select a valid PDF file (.pdf format only).');
            return;
          }
          setFormError('');
          setResumeFileName(file.name);
          const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
          setResumeFileSize(`${parseFloat(sizeMB) > 0 ? sizeMB : '0.8'} MB`);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (!email || !password) { setFormError('Please enter both email and password.'); return; }
        login(email, password);
      };

      const handleSignup = (e) => {
        e.preventDefault();
        if (!fullName || !email || !password) { setFormError('Please fill in your name, email, and password.'); return; }
        signup({
          fullName, email, college,
          phone: phone || '',
          resumeFileName: resumeFileName || 'Resume.pdf',
          resumeFileSize: resumeFileSize || '1.0 MB',
          linkedinUrl: linkedinUrl || '',
          githubUrl: githubUrl || '',
          tenthMarks: tenthMarks || '',
          twelfthMarks: twelfthMarks || '',
          gradCgpa: gradCgpa || '',
          postGradCgpa: postGradCgpa || '',
          targetDomain, targetGoal
        });
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-slate-950">
          <div className="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 rounded-3xl overflow-hidden border border-slate-800 bg-slate-900/80 shadow-2xl backdrop-blur-xl">
            {/* Hero Banner */}
            <div className="lg:col-span-5 p-8 bg-gradient-to-b from-blue-950/60 to-slate-950 border-b lg:border-b-0 lg:border-r border-slate-800 flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-2.5 mb-6">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-amber-400 p-[2px]">
                    <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                      <Icon name="zap" className="w-5 h-5 text-amber-300" />
                    </div>
                  </div>
                  <div>
                    <span className="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-amber-300 bg-clip-text text-transparent">
                      QuickApply
                    </span>
                    <span className="block text-[10px] font-bold text-slate-400">Career Acceleration OS</span>
                  </div>
                </div>

                <h2 className="text-2xl font-black text-white mb-2">Your Goal.<br />Your Roadmap.<br /><span className="text-emerald-400">Your Opportunities.</span></h2>
                <p className="text-xs text-slate-400 mb-6">Stop application fatigue. 1-click apply with verified academic credentials and match radar.</p>

                <div className="space-y-3">
                  <div className="flex items-center gap-2 text-xs text-slate-300">
                    <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
                    <span>AI Diagnostic Skill Assessment</span>
                  </div>
                  <div className="flex items-center gap-2 text-xs text-slate-300">
                    <Icon name="layers" className="w-4 h-4 text-blue-400" />
                    <span>4-Phase Dynamic Roadmap</span>
                  </div>
                  <div className="flex items-center gap-2 text-xs text-slate-300">
                    <Icon name="radar" className="w-4 h-4 text-emerald-400" />
                    <span>Opportunity Radar with Match Scores</span>
                  </div>
                  <div className="flex items-center gap-2 text-xs text-slate-300">
                    <Icon name="zap" className="w-4 h-4 text-amber-400" />
                    <span>⚡ 1-Click Quick Apply Assistant</span>
                  </div>
                </div>
              </div>

              <div className="pt-6 border-t border-slate-800 text-[11px] text-slate-500">
                Student First • 100% Free
              </div>
            </div>

            {/* Form */}
            <div className="lg:col-span-7 p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
              <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 mb-5">
                <button
                  type="button"
                  onClick={() => { setAuthMode('login'); setFormError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg ${authMode === 'login' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                >
                  Sign In
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode('signup'); setFormError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg ${authMode === 'signup' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                >
                  Create Account
                </button>
              </div>

              {/* Demo button */}
              <div className="mb-4 p-3 bg-blue-950/40 border border-blue-500/30 rounded-xl flex items-center justify-between">
                <span className="text-xs text-slate-200">Want to explore? Try the demo instantly.</span>
                <button
                  type="button"
                  onClick={() => login('demo@student.com', 'password123')}
                  className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg shadow-sm transition-all"
                >
                  ⚡ Quick Demo Access
                </button>
              </div>

              {formError && <div className="mb-4 text-xs text-red-400 bg-red-950/40 p-2.5 rounded-lg border border-red-500/30">{formError}</div>}

              {authMode === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Student Email</label>
                    <input
                      type="email"
                      required
                      placeholder="student@univ.edu"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••••••"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200"
                    />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/20">
                    Sign In to QuickApply →
                  </button>
                </form>
              ) : (
                <form onSubmit={handleSignup} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">Full Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Alex Morgan"
                        value={fullName}
                        onChange={(e) => setFullName(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">College</label>
                      <input
                        type="text"
                        placeholder="Institute of Tech"
                        value={college}
                        onChange={(e) => setCollege(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">Email *</label>
                      <input
                        type="email"
                        required
                        placeholder="student@univ.edu"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="••••••••••••"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      />
                    </div>
                  </div>

                  {/* Profile Dossier Inputs */}
                  <div className="p-3 bg-slate-950/70 border border-slate-800 rounded-xl space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider block">
                        ⚡ Quick Apply Dossier Intake
                      </span>
                      <span className="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                        1-Click Ready
                      </span>
                    </div>

                    {/* Resume PDF Upload */}
                    <div className="p-2.5 rounded-lg bg-slate-900 border border-slate-800">
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-[11px] font-semibold text-slate-300 flex items-center gap-1.5">
                          <Icon name="fileText" className="w-3.5 h-3.5 text-red-400" />
                          <span>Resume in PDF format *</span>
                        </label>
                        <span className="text-[10px] text-emerald-400 font-medium">✓ Verified PDF</span>
                      </div>
                      <div className="flex flex-col sm:flex-row sm:items-center gap-2">
                        <div className="flex-1 px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between min-w-0">
                          <div className="flex items-center gap-1.5 truncate">
                            <span className="text-[10px] px-1 py-0.2 rounded bg-red-500/20 text-red-400 font-bold uppercase">PDF</span>
                            <span className="text-xs text-slate-200 truncate">{resumeFileName}</span>
                          </div>
                          <span className="text-[10px] text-slate-500 shrink-0 ml-1">{resumeFileSize}</span>
                        </div>
                        <label className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold cursor-pointer shrink-0 text-center">
                          <span>Choose PDF</span>
                          <input type="file" accept=".pdf,application/pdf" onChange={handleResumeChange} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">Phone Number</label>
                        <input
                          type="tel"
                          placeholder="+91 98765 43210"
                          value={phone}
                          onChange={(e) => setPhone(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">LinkedIn URL</label>
                        <input
                          type="url"
                          placeholder="https://linkedin.com/in/username"
                          value={linkedinUrl}
                          onChange={(e) => setLinkedinUrl(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-[10px] text-slate-400 mb-0.5">GitHub URL</label>
                        <input
                          type="url"
                          placeholder="https://github.com/username"
                          value={githubUrl}
                          onChange={(e) => setGithubUrl(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">10th Class Marks (%)</label>
                        <input
                          type="text"
                          placeholder="e.g. 94.6%"
                          value={tenthMarks}
                          onChange={(e) => setTenthMarks(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">12th Class Marks (%)</label>
                        <input
                          type="text"
                          placeholder="e.g. 92.4%"
                          value={twelfthMarks}
                          onChange={(e) => setTwelfthMarks(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">Graduation CGPA</label>
                        <input
                          type="text"
                          placeholder="e.g. 8.85 CGPA"
                          value={gradCgpa}
                          onChange={(e) => setGradCgpa(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-slate-400 mb-0.5">Post-Grad CGPA</label>
                        <input
                          type="text"
                          placeholder="e.g. 8.60 / Pursuing"
                          value={postGradCgpa}
                          onChange={(e) => setPostGradCgpa(e.target.value)}
                          className="w-full px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-slate-200"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">Domain</label>
                      <select
                        value={targetDomain}
                        onChange={(e) => setTargetDomain(e.target.value)}
                        className="w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      >
                        {Object.values(DOMAINS).map((d) => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-0.5">Goal</label>
                      <select
                        value={targetGoal}
                        onChange={(e) => setTargetGoal(e.target.value)}
                        className="w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200"
                      >
                        {Object.values(GOAL_TYPES).map((g) => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-blue-600 to-emerald-600 hover:opacity-90 text-white font-bold text-xs rounded-xl shadow-lg mt-2">
                    Complete Profile & Start Roadmap 🚀
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Root App
    function App() {
      const { isAuthenticated, activeTab, toastMessage } = useApp();

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
            <PublicHeader />
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <AuthGate />
            </main>
            {toastMessage && (
              <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-400 text-xs px-4 py-3 rounded-xl shadow-xl">
                ✓ {toastMessage}
              </div>
            )}
            <footer className="border-t border-slate-900 py-5 text-center text-xs text-slate-500">
              QuickApply © 2026 • Student Career Acceleration Platform • Your Goal. Your Roadmap. Your Opportunities.
            </footer>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          <Navbar />
          <main className="flex-1 pb-16">
            {activeTab === 'direction' && <OnboardingAssessment />}
            {activeTab === 'dashboard' && <Dashboard />}
            {activeTab === 'radar' && <OpportunityRadar />}
            {activeTab === 'applications' && <ApplicationTracker />}
          </main>
          <QuickApplyModal />
          <UserProfileModal />
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-400 text-xs px-4 py-3 rounded-xl shadow-xl">
              ✓ {toastMessage}
            </div>
          )}
          <footer className="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
            QuickApply © 2026 • Student Career Acceleration Platform
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
